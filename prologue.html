<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;

#stage{position:absolute;inset:0;z-index:0}
#scene{position:absolute;inset:0;z-index:0}
#scene canvas{display:block}
/* 幕背景：每一幕一张实景底图（3D 画布已改成透明，底图从下面透上来） */
#bg{position:absolute;inset:0;z-index:0;opacity:.46;
  background-size:cover;background-position:center 44%;background-repeat:no-repeat;
  filter:saturate(.72) brightness(.60) contrast(1.06);transform:scale(1);
  transition:background-image .9s ease,opacity .9s ease}
#bg.shift{animation:bgShift 1.25s cubic-bezier(.2,.75,.25,1) both}
@keyframes bgShift{0%{opacity:.08;transform:scale(1.035);filter:saturate(.42) brightness(.38) contrast(1.12)}100%{opacity:var(--bg-opacity,.46);transform:scale(1);filter:saturate(.72) brightness(.60) contrast(1.06)}}
#bg::after{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 46%,rgba(5,15,20,.28) 28%,rgba(5,15,20,.88) 90%)}
/* 暗角 + 扫描线：给 3D 一层"指挥厅屏幕"的质感 */
#vig{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 42%,rgba(0,0,0,.62) 100%)}
#scan{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.16;

#stageFx::before{content:'';position:absolute;left:-8%;right:-8%;top:42%;height:2px;
  background:linear-gradient(90deg,transparent,rgba(79,224,200,.95),rgba(255,200,87,.82),transparent);
  box-shadow:0 0 18px rgba(79,224,200,.72),0 0 46px rgba(79,224,200,.28);
  transform:translateX(-110%);opacity:.9}
#stageFx.show::before{animation:stageSweep .9s .08s cubic-bezier(.2,.75,.25,1) both}
#stageFx::after{content:'';position:absolute;inset:12% 4%;border:1px solid rgba(79,224,200,.20);
  clip-path:polygon(0 0,100% 0,100% 18%,0 18%);transform:translateY(22vh);opacity:0}
#stageFx.show::after{animation:stageFrame .9s .15s ease-out both}
#stageFxTag{position:absolute;left:50%;top:34%;transform:translate(-50%,16px);white-space:nowrap;

  text-shadow:0 0 18px rgba(79,224,200,.8);opacity:0}
#stageFx.show #stageFxTag{animation:stageTag .85s .1s ease-out both}
@keyframes stageWipe{0%{opacity:0;background:rgba(3,13,17,0)}18%{opacity:1;background:rgba(3,13,17,.24)}72%{opacity:1;background:rgba(3,13,17,.08)}100%{opacity:0;background:rgba(3,13,17,0)}}
@keyframes stageSweep{0%{transform:translateX(-110%)}100%{transform:translateX(110%)}}
@keyframes stageFrame{0%{opacity:0;transform:translateY(22vh)}35%,72%{opacity:1}100%{opacity:0;transform:translateY(-18vh)}}
@keyframes stageTag{0%{opacity:0;transform:translate(-50%,16px);letter-spacing:6px}35%,70%{opacity:1}100%{opacity:0;transform:translate(-50%,-12px);letter-spacing:4px}}
#impactFx{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;

#impactFx.warn{background:radial-gradient(circle at 50% 54%,rgba(255,95,95,.34),rgba(255,95,95,.06) 34%,transparent 70%)}
@keyframes impactBurst{0%{opacity:0;transform:scale(.94)}18%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
/* 警报红光 */

/* ---------- 中央大数字 ---------- */
#bigNum{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);z-index:5;

/* ---------- 六座水池状态（第三幕） ---------- */
#labPanel{position:absolute;right:26px;top:50%;transform:translateY(-50%) translateX(12px);z-index:6;
  width:236px;background:var(--panel);border:1px solid var(--line);border-radius:12px;

.lp-r.on{color:var(--ink)}

/* ---------- 跳过 ---------- */
#btnSkip{position:absolute;right:26px;bottom:30px;z-index:9;background:transparent;
  border:1px solid var(--line);color:var(--dim);font-size:11px;letter-spacing:1.4px;
  padding:8px 15px;border-radius:8px;cursor:pointer;transition:all .22s ease;font-family:inherit}
#btnSkip:hover{color:var(--cy);border-color:var(--cy);background:rgba(79,224,200,.08)}

/* ---------- 结尾面板 ---------- */
#endPanel{position:absolute;inset:0;z-index:12;display:none;place-items:center;
  background:linear-gradient(180deg,rgba(3,10,13,.72),rgba(3,10,13,.90));backdrop-filter:blur(3px)}
#endPanel.show{display:grid;animation:fadeIn .6s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#endInner{width:min(1020px,94vw);max-height:92vh;overflow-y:auto;padding:8px 4px}
#endInner h2{font-size:23px;font-weight:800;letter-spacing:1.5px;text-align:center}

#endInner .lead{margin:20px auto 4px;max-width:760px;font-size:13px;line-height:2;color:var(--dim);
  text-align:center;letter-spacing:.4px}
#endInner .lead b{color:var(--am)}
#routeCap{text-align:center;font-size:11px;letter-spacing:1.4px;color:var(--faint);margin:20px 0 -8px}
#routeCap b{color:var(--cy)}
#routeGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:22px 0 6px}
/* 基态必须可见：animation 只是入场增强，一旦动画不执行（无头 / 省电模式）也不能丢卡片 */
.rcard{background:rgba(11,28,34,.88);border:1px solid rgba(79,224,200,.20);border-radius:12px;
  padding:14px 16px;display:flex;gap:13px;align-items:flex-start;

@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.rcard.locked{border-color:rgba(120,150,158,.14);opacity:.62}

.rnum{flex:0 0 40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:14px;

  border:1px solid var(--line);color:var(--cy);font-family:ui-monospace,Menlo,Consolas,monospace}
.rcard.locked .rnum{background:rgba(120,150,158,.08);border-color:rgba(120,150,158,.18);color:var(--faint)}
.rn{font-size:13.5px;font-weight:800;letter-spacing:.5px}
.rt{font-size:10.5px;color:var(--faint);margin-top:3px;line-height:1.6}
.rbadge{margin-left:auto;font-size:9.5px;letter-spacing:1.2px;padding:3px 8px;border-radius:20px;
  background:rgba(79,224,200,.14);color:var(--cy);border:1px solid var(--line);white-space:nowrap}
.rbadge.lock{background:rgba(120,150,158,.10);color:var(--faint);border-color:rgba(120,150,158,.18)}
#entryRow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:24px 0 6px}
.ebtn{display:inline-block;padding:13px 26px;border-radius:10px;font-size:13.5px;font-weight:700;
  letter-spacing:.8px;text-decoration:none;cursor:pointer;border:1px solid var(--line);
  background:linear-gradient(150deg,rgba(79,224,200,.22),rgba(79,224,200,.06));color:var(--cy);
  transition:all .22s ease;font-family:inherit}

/* ---------- 落幕 → 回舰桥（ENDTXT.exit.on = true 时走这条路） ---------- */
#curtain{position:absolute;inset:0;z-index:30;display:grid;place-items:center;

  opacity:0;transition:opacity .85s ease;pointer-events:none}
#curtain[hidden]{display:none}
#curtain.show{opacity:1;pointer-events:auto}
#curtain .ct-in{text-align:center;padding:0 24px;transform:translateY(10px);
  transition:transform 1s cubic-bezier(.22,.9,.3,1)}
#curtain.show .ct-in{transform:translateY(0)}
.ct-kicker{font-size:10.5px;letter-spacing:4px;color:var(--cy);opacity:.85;
  font-family:ui-monospace,Menlo,Consolas,monospace}
.ct-line{margin-top:16px;font-size:clamp(24px,4.6vw,38px);font-weight:800;letter-spacing:6px;

@keyframes ctBlink{0%,100%{opacity:.42}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){
  #curtain,#curtain .ct-in{transition-duration:.01ms!important}

}

/* ---------- 3D 失败提示 ---------- */
#errMsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;display:none;

#errMsg.show{display:block}
#errMsg .et{font-size:14px;font-weight:800;color:var(--rd);margin-bottom:9px}
#errMsg .eb{font-size:12px;line-height:1.9;color:var(--dim)}
@media (max-width:760px){
  #logBox{display:none}
  .dtext{font-size:14px;min-height:88px}
  #actPlaque{left:18px;top:16px}
}
@media (prefers-reduced-motion:reduce){
  #bg.shift,#stageFx.show,#stageFx.show::before,#stageFx.show::after,#stageFx.show #stageFxTag,
  #impactFx.burst,#dlg.show,#dlg.show .dav{animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>

<script type="module">

/* ================================================================
   序章 · 四十七天 —— 剧情引擎
   依据：文字文稿1(5)(1).docx（六关齐全版）
   人物沿用：老所长 ⚓ / 老陈教授 🎓 / 钱船长 📻 / 阿洛 🦊

const $ = id => document.getElementById(id);

/* ---------- 音效（WebAudio，失败静默） ---------- */
let _ac = null;
function AC(){ if(!_ac){ try{ _ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ _ac = null; } } return _ac; }
function tone(f, d, ty, g){
  const c = AC(); if(!c) return;
  try{
    const o = c.createOscillator(), gn = c.createGain();
    o.type = ty || 'sine'; o.frequency.value = f;
    gn.gain.setValueAtTime(0, c.currentTime);
    gn.gain.linearRampToValueAtTime(g || 0.05, c.currentTime + 0.012);
    gn.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + d);
    o.connect(gn); gn.connect(c.destination);
    o.start(); o.stop(c.currentTime + d + 0.02);
  }catch(e){}
}

function log(t, c){
  const b = $('logBox'); if(!b) return;
  const d = document.createElement('div');
  if(c) d.className = c;
  d.textContent = t;
  b.insertBefore(d, b.firstChild);

/* ---------- 打字机（支持 <b> 标签，不破坏结构） ---------- */
let tTimer = null, tParts = null, tPi = 0, tCi = 0, tEl = null, typing = false, tCB = null;
function splitHTML(html){
  const out = []; const re = /<b>([\s\S]*?)<\/b>/g;
  let last = 0, m;
  while((m = re.exec(html))){
    if(m.index > last) out.push({ b:false, s:html.slice(last, m.index) });
    out.push({ b:true, s:m[1] });
    last = m.index + m[0].length;
  }
  if(last < html.length) out.push({ b:false, s:html.slice(last) });
  return out;
}
function typeHTML(el, html, cb){
  if(tTimer){ clearInterval(tTimer); tTimer = null; }
  tParts = splitHTML(html); tPi = 0; tCi = 0; tEl = el; typing = true; tCB = cb || null;
  const render = () => {
    let s = '';
    for(let i = 0; i < tPi && i < tParts.length; i++){
      const p = tParts[i];
      s += p.b ? ('<b>' + p.s + '</b>') : p.s;
    }
    if(tPi < tParts.length){
      const p = tParts[tPi];
      const seg = p.s.slice(0, tCi);
      s += p.b ? ('<b>' + seg + '</b>') : seg;
    }
    el.innerHTML = s + '<span class="type-cursor">▌</span>';
  };
  render();
  tTimer = setInterval(() => {
    if(tPi >= tParts.length){
      clearInterval(tTimer); tTimer = null; typing = false;
      let s = '';
      for(const p of tParts) s += p.b ? ('<b>' + p.s + '</b>') : p.s;
      el.innerHTML = s;
      if(tCB){ const f = tCB; tCB = null; f(); }
      return;
    }
    const p = tParts[tPi];
    tCi++;
    if(tCi > p.s.length){ tPi++; tCi = 0; }
    render();
  }, 15);
}
function finishType(){
  if(!typing || !tEl) return;
  if(tTimer){ clearInterval(tTimer); tTimer = null; }
  typing = false;
  let s = '';
  for(const p of tParts) s += p.b ? ('<b>' + p.s + '</b>') : p.s;
  tEl.innerHTML = s;
  if(tCB){ const f = tCB; tCB = null; f(); }
}

function renderLabs(lit, mode){
  const b = $('labBody'); if(!b) return;
  if(b.children.length !== 6){
    b.innerHTML = '';
    for(const L of LABS){
      const d = document.createElement('div');
      d.className = 'lp-r';
      d.innerHTML = '<span class="lp-n">' + L[0] + '</span><span class="lp-d"></span><span>' + L[1] + '</span>';
      b.appendChild(d);
    }
  }
  const wait = (mode === 2);
  for(let i = 0; i < 6; i++){
    const r = b.children[i];
    if(!r) continue;
    r.classList.toggle('wait', wait);
    if(!wait && i < lit) r.classList.add('on'); else r.classList.remove('on');
  }
  const n = $('labNote');
  if(n){
    n.innerHTML = wait
      ? '◇ 调度台：已接入 · <b>起点待判定</b><br>先做摸底测评，再由它排定要下哪几座池子。'

let ai = 0, bi = 0, ended = false;
let setStage3 = function(){};   /* 由 3D 段覆盖 */
let fx3       = function(){};   /* 由 3D 段覆盖 */

/* ── 权威状态：由每句话的 st 声明写入，3D 与 DOM 面板都只读这里 ──
   放在推进段（而非 3D 段）是为了不依赖 3D 是否加载成功 —— 3D 挂了，
   剧情与面板照常工作。改剧情时不用碰这些变量，只写 st 即可。      */
let waveReq  = 0;     /* A2 波形阶段 0..3 */
let tankMode = 1;     /* A3 六舱：1=按 tankLit 点亮（介绍） 2=待判定（摸底） */
let tankLit  = 0;     /* tankMode=1 时点亮的个数 0..6 */
let scanT    = 99;    /* 扫描光带计时，>=2.6 视为扫完 */

function impact(kind){
  const box = $('impactFx'); if(!box) return;
  box.className = kind === 'warn' ? 'warn' : '';
  void box.offsetWidth;
  box.classList.add('burst');
}

/* 把一句话声明的持续状态写进权威状态（幂等，重复调用无害） */
function applySt(st){
  if(!st) return;
  if(typeof st.wave === 'number') waveReq = st.wave;
  if(st.tank !== undefined){
    if(st.tank === 'scan'){ tankMode = 2; tankLit = 0; scanT = 0; }  /* 重扫一遍 */
    else if(st.tank === 'wait'){ tankMode = 2; tankLit = 0; }        /* 保持待判定 */
    else { tankMode = 1; tankLit = Math.max(0, Math.min(6, st.tank | 0)); }
  }
}

function setAct(i){
  /* 换幕时把状态复位到该幕的起始态（这样单独调试某一幕也能看） */
  waveReq = 0; tankMode = 1; tankLit = 0; scanT = 99;
  const p = $('actPlaque');
  p.querySelector('b').textContent = ACTS[i].title;
  p.querySelector('.sub').textContent = ACTS[i].sub;

function runExit(x){
  const c = $('curtain');
  if(!c){ location.replace(x.href || 'index.html'); return; }
  if($('ctKicker')) $('ctKicker').textContent = x.kicker || '';
  if($('ctLine'))   $('ctLine').textContent   = x.line   || '';
  if($('ctSub'))    $('ctSub').textContent    = x.sub    || '';
  c.hidden = false;
  void c.offsetWidth;
  c.classList.add('show');
  const go = () => { try{ location.replace(x.href || 'index.html'); }
                     catch(e){ location.href = x.href || 'index.html'; } };
  const hold = Math.max(0, Number(x.hold) || 0);
  if(hold) setTimeout(go, hold); else go();
}

/* ================================================================
   启动自检 —— 剧情数据写错在这里立刻报出来，而不是播到那句才崩
   ────────────────────────────────────────────────────────────────
   改完 BEATS / LABS / ROUTE / ENDTXT 后打开页面看 console：
   没有问题会打印「[剧本自检] 通过」，有问题会逐条列出（不阻断播放）。
   ================================================================ */
const FX_KNOWN = ['num','dim','bow','bulb','cancel','flash','tanks','scan','quiz','k7','strait','radio','alarm','end'];

function auditScript(){
  const w = [], roles = Object.keys(CAST).map(k => CAST[k]);
  let n = 0;
  ACTS.forEach(a => {
    const arr = BEATS[a.k];
    if(!arr || !arr.length){ w.push(`幕 ${a.k} 在 BEATS 里没有对应的对白数组`); return; }
    arr.forEach((b, j) => {
      n++;
      const at = `${a.k}#${j}`;
      if(!roles.includes(b.w))        w.push(`${at}: 说话人不在 CAST 里（新角色要先登记）`);
      if(typeof b.t !== 'string' || !b.t.trim()) w.push(`${at}: 文本为空`);
      if(b.fx && !FX_KNOWN.includes(b.fx)) w.push(`${at}: fx「${b.fx}」3D 里没有对应表现（剧情照常播，可先不管）`);
      const st = b.st || {};
      if(st.wave !== undefined && !(st.wave >= 0 && st.wave <= 3))
        w.push(`${at}: st.wave 只能是 0..3`);
      if(st.tank !== undefined){
        const ok = st.tank === 'scan' || st.tank === 'wait' ||
                   (typeof st.tank === 'number' && st.tank >= 0 && st.tank <= 6);
        if(!ok) w.push(`${at}: st.tank 只能是 0..6 或 'scan' / 'wait'`);
      }
    });
  });
  if(ROUTE.length !== LABS.length) w.push(`ROUTE(${ROUTE.length}) 与 LABS(${LABS.length}) 条数不一致`);
  if(!QUIZ || !QUIZ.href)          w.push('QUIZ.href 缺失，摸底测评入口会失效');
  ['lead','cap','note','btns'].forEach(k => { if(!ENDTXT[k]) w.push(`ENDTXT 缺字段 ${k}`); });
  if(ENDTXT.btns && !ENDTXT.btns.length) w.push('ENDTXT.btns 为空，结尾没有入口');
  /* 出口：走「落幕回舰桥」这条时，href 必须有，否则跳不出去 */
  if(ENDTXT.exit && ENDTXT.exit.on && !ENDTXT.exit.href)
    w.push('ENDTXT.exit.on 为 true 但 exit.href 为空，序章结束会停在落幕幕布上');
  if(!ENDTXT.exit) w.push('ENDTXT.exit 缺失，序章结束会回落到旧版「启程」面板');

  const res = { ok:(w.length === 0), beats:n, warns:w };
  if(w.length) console.warn('[剧本自检] ' + w.length + ' 处问题（不阻断播放）：\n- ' + w.join('\n- '));
  else         console.log('[剧本自检] 通过 · ' + n + ' 句对白 / ' + ACTS.length + ' 幕');
  return res;
}

/* ---------- 波形参数 ---------- */
const WK = 2.24;                 /* 波数 k = 2π/λ，λ≈2.8 */
const WA = 0.62;                 /* 单列波振幅 */
function waveAt(x, t, a2, ph){
  const w1 = WA * Math.sin(WK * x - t * 2.1);
  const w2 = a2 * WA * Math.sin(WK * x - t * 2.1 + ph);
  return { w1, w2, sum: w1 + w2 };
}

/* ---------- 第一幕：岛群海图 + 航线 ---------- */
function buildMap(){
  mapGroup = new THREE.Group(); scene.add(mapGroup);

  let seed = 987654321;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

  /* 岛屿：11 座沿一圈分布（俯视才像海图） */
  const N = 11;
  for(let i = 0; i < N; i++){
    const ang = (i / N) * Math.PI * 2 + (rnd() - 0.5) * 0.26;
    const rad = 15 + rnd() * 12;
    const x = Math.cos(ang) * rad;
    const z = Math.sin(ang) * rad * 0.70;
    const r = 1.9 + rnd() * 2.5;
    const g = new THREE.IcosahedronGeometry(r, 0);
    g.scale(1, 0.62 + rnd() * 0.42, 1);
    const m = new THREE.MeshStandardMaterial({
      color:0x3d6659, roughness:0.92, metalness:0.02, flatShading:true
    });
    const mesh = new THREE.Mesh(g, m);
    mesh.position.set(x, -1.9, z);
    mesh.rotation.y = rnd() * 6.28;
    mapGroup.add(mesh);
    isles.push({ x, z });
  }

  /* 航线：环上相邻相连 + 两条跨岛直连，贴海面起伏 */
  const mkRoute = (a, b, h) => {
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    const pts = [
      new THREE.Vector3(a.x, 0.30, a.z),
      new THREE.Vector3(a.x + dx * 0.30, h * 0.55, a.z + dz * 0.30 - len * 0.04),
      new THREE.Vector3((a.x + b.x) / 2, h, (a.z + b.z) / 2 + len * 0.05),
      new THREE.Vector3(a.x + dx * 0.70, h * 0.55, a.z + dz * 0.70 + len * 0.04),
      new THREE.Vector3(b.x, 0.30, b.z)
    ];
    const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.35);
    const mat = new THREE.MeshStandardMaterial({
      color:0x17414c, emissive:0x4fe0c8, emissiveIntensity:0.85, roughness:0.42
    });
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, 0.068, 6, false), mat);
    mapGroup.add(tube);
    routeTubes.push(tube); routeCur.push(0.85); routeTgt.push(0.85);
  };
  for(let i = 0; i < N; i++) mkRoute(isles[i], isles[(i + 1) % N], 1.5 + rnd() * 0.9);
  mkRoute(isles[0], isles[5], 2.4);
  mkRoute(isles[3], isles[8], 2.1);

  /* 演示用的小船 + 船头水墙 */
  bowShip = new THREE.Group();
  const hull = new THREE.Mesh(
    new THREE.BoxGeometry(1.0, 0.55, 2.8),
    new THREE.MeshStandardMaterial({ color:0x8f9aa0, roughness:0.5, metalness:0.35 })
  );
  hull.position.y = 0.1; bowShip.add(hull);
  const prow = new THREE.Mesh(
    new THREE.ConeGeometry(0.52, 1.1, 12),
    new THREE.MeshStandardMaterial({ color:0x8f9aa0, roughness:0.5, metalness:0.35 })
  );
  prow.rotation.x = -Math.PI / 2; prow.position.set(0, 0.1, 1.9); bowShip.add(prow);
  const deck = new THREE.Mesh(
    new THREE.BoxGeometry(0.86, 0.42, 1.0),
    new THREE.MeshStandardMaterial({ color:0xcfd8d4, roughness:0.6 })
  );
  deck.position.set(0, 0.52, -0.5); bowShip.add(deck);
  bowShip.visible = false; mapGroup.add(bowShip);

  /* 水墙：开口圆柱的一段，立在船头前方 */
  const wallGeo = new THREE.CylinderGeometry(1.9, 1.9, 1.15, 26, 1, true, -0.72, 1.44);
  const wallMat = new THREE.MeshStandardMaterial({
    color:0x2fa8c8, emissive:0x2fa8c8, emissiveIntensity:0.55,
    transparent:true, opacity:0.42, side:THREE.DoubleSide, roughness:0.25
  });
  bowWall = new THREE.Mesh(wallGeo, wallMat);
  bowWall.position.set(0, 0.15, 2.4);
  bowWall.visible = false;
  bowShip.add(bowWall);
}

/* ---------- 第二幕：兴波相消演示 ---------- */
function buildWave(){
  waveGroup = new THREE.Group(); waveGroup.visible = false; scene.add(waveGroup);

  /* 船体侧剖面：Shape + 薄挤出 */
  const sh = new THREE.Shape();
  sh.moveTo(-3.2, 0.55);
  sh.lineTo(3.0, 0.55);
  sh.quadraticCurveTo(4.15, 0.42, 3.95, -0.30);
  sh.lineTo(2.2, -0.86);
  sh.lineTo(-2.4, -0.86);
  sh.quadraticCurveTo(-3.6, -0.55, -3.2, 0.55);
  const hg = new THREE.ExtrudeGeometry(sh, { depth:1.5, bevelEnabled:true, bevelSize:0.06, bevelThickness:0.06, bevelSegments:2 });
  hg.translate(0, 0, -0.75);
  hullMesh = new THREE.Mesh(hg, new THREE.MeshStandardMaterial({
    color:0x93a0a6, roughness:0.45, metalness:0.42
  }));
  hullMesh.position.y = 0.30;
  waveGroup.add(hullMesh);

  /* 上层建筑 */
  const sb = new THREE.Mesh(
    new THREE.BoxGeometry(1.5, 0.62, 1.2),
    new THREE.MeshStandardMaterial({ color:0xd6dcd8, roughness:0.62 })
  );
  sb.position.set(-0.7, 1.22, 0); waveGroup.add(sb);

  /* 球鼻艏（phase 2 起出现） */
  bulbMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.44, 18, 14),
    new THREE.MeshStandardMaterial({ color:0xffc857, roughness:0.35, metalness:0.5,
      emissive:0x6b4d10, emissiveIntensity:0.9 })
  );
  bulbMesh.scale.set(2.4, 1.2, 1.2);
  bulbMesh.position.set(4.85, -0.52, 0);   /* 船艏前下方，露出船体才看得见 */
  bulbMesh.scale.setScalar(0.001);
  waveGroup.add(bulbMesh);

  /* 三条波形曲线 */
  const cols = [0x4fe0c8, 0xffc857, 0xffffff];
  for(let i = 0; i < 3; i++){
    const N = 130;
    const arr = new Float32Array(N * 3);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    const m = new THREE.LineBasicMaterial({ color:cols[i], transparent:true, opacity:i === 2 ? 0.95 : 0.72 });
    const ln = new THREE.Line(g, m);
    ln.frustumCulled = false;
    waveGroup.add(ln);
    waveLines.push(ln); waveArrs.push(arr);
  }

  /* 演示水面 */
  waveSeaGeo = new THREE.PlaneGeometry(26, 11, 90, 30);
  waveSeaGeo.rotateX(-Math.PI / 2);
  waveSeaBase = Float32Array.from(waveSeaGeo.attributes.position.array);
  waveSea = new THREE.Mesh(waveSeaGeo, new THREE.MeshStandardMaterial({
    color:0x0d2f3a, roughness:0.42, metalness:0.22
  }));
  waveSea.position.set(0, -1.05, 0);
  waveGroup.add(waveSea);

  /* 图例：三个小色块不方便做文字，用三条短竖线代替 */
}

/* ---------- 第三幕：星海号六舱 ---------- */
function buildShip(){
  shipGroup = new THREE.Group(); shipGroup.visible = false; scene.add(shipGroup);

  const sh = new THREE.Shape();
  sh.moveTo(-6.4, 1.10);
  sh.lineTo(6.0, 1.10);
  sh.quadraticCurveTo(8.3, 0.84, 7.9, -0.60);
  sh.lineTo(4.4, -1.72);
  sh.lineTo(-4.8, -1.72);
  sh.quadraticCurveTo(-7.2, -1.10, -6.4, 1.10);
  const hg = new THREE.ExtrudeGeometry(sh, { depth:3.0, bevelEnabled:true, bevelSize:0.10, bevelThickness:0.10, bevelSegments:2 });
  hg.translate(0, 0, -1.5);
  const hull = new THREE.Mesh(hg, new THREE.MeshStandardMaterial({
    color:0x8c9aa1, roughness:0.46, metalness:0.40
  }));
  shipGroup.add(hull);

  const sup = new THREE.Mesh(
    new THREE.BoxGeometry(3.0, 1.25, 2.4),
    new THREE.MeshStandardMaterial({ color:0xd6dcd8, roughness:0.62 })
  );
  sup.position.set(-1.4, 2.42, 0); shipGroup.add(sup);

  /* 六个实验舱 */
  /* 舱位做成贴在船壳外表面的发光窗口 —— 埋进船体里就看不见了 */
  const xs = [-5.0, -3.0, -1.0, 1.0, 3.0, 5.0];
  for(let i = 0; i < 6; i++){
    const mat = new THREE.MeshStandardMaterial({
      color:0x123038, emissive:0x4fe0c8, emissiveIntensity:0.05, roughness:0.5
    });
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.30, 1.30, 0.34), mat);
    b.position.set(xs[i], -0.32, 1.62);
    shipGroup.add(b); tankBoxes.push(b);

    const rm = new THREE.MeshBasicMaterial({ color:0x4fe0c8, transparent:true, opacity:0, side:THREE.DoubleSide });
    const r = new THREE.Mesh(new THREE.RingGeometry(1.05, 1.24, 28), rm);
    r.position.set(xs[i], -0.32, 1.84);
    shipGroup.add(r); tankRings.push(r);
  }

  /* K-7 标记 */
  const kg = new THREE.Group();
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.42, 16, 12),
    new THREE.MeshStandardMaterial({ color:0xffc857, emissive:0xffc857, emissiveIntensity:1.1 })
  );
  kg.add(dot);
  const kr = new THREE.Mesh(
    new THREE.RingGeometry(0.85, 1.05, 30),
    new THREE.MeshBasicMaterial({ color:0xffc857, transparent:true, opacity:0.55, side:THREE.DoubleSide })
  );
  kr.rotation.x = -Math.PI / 2.1; kg.add(kr);
  kg.position.set(-10.5, 1.0, 7.0);   /* 浮在海面上，沉下去会被海面挡住 */
  kg.visible = false;
  shipGroup.add(kg); k7Mark = kg;

  /* 风暴海峡：航线末端的两道门柱 */
  const sg = new THREE.Group();
  for(let i = 0; i < 2; i++){
    const p = new THREE.Mesh(
      new THREE.BoxGeometry(0.7, 5.2, 0.7),
      new THREE.MeshStandardMaterial({ color:0x2a4a52, roughness:0.85, flatShading:true })
    );
    p.position.set(i === 0 ? -3.2 : 3.2, 0.6, 0);
    sg.add(p);
  }
  const arch = new THREE.Mesh(
    new THREE.TorusGeometry(3.4, 0.20, 8, 40, Math.PI),
    new THREE.MeshStandardMaterial({ color:0x4fe0c8, emissive:0x4fe0c8, emissiveIntensity:0.9, roughness:0.35 })
  );
  arch.position.set(0, 3.1, 0); sg.add(arch);
  sg.position.set(11.5, 0.4, -7.5);
  sg.visible = false;
  shipGroup.add(sg); straitGate = sg;
}

/* ================================================================
   舞台切换与特效
   ================================================================ */
setStage3 = function(s){
  stage = s;
  if(!HAS3D) return;
  stageT = 0;
  if(mapGroup)  mapGroup.visible  = (s === 'map');
  if(waveGroup) waveGroup.visible = (s === 'wave');
  if(shipGroup) shipGroup.visible = (s === 'ship' || s === 'alarm' || s === 'end');
  if(s === 'map')   setCam('map');
  if(s === 'wave'){ setCam('wave'); wavePhase = 0; ampMix = 0; phaseMix = 0; bulbMix = 0; }
  if(s === 'ship'){ setCam('ship'); }
  if(s === 'alarm'){ setCam('alarm'); }
  if(s === 'end'){ setCam('end'); }
};

fx3 = function(act, bi, fx, st){
  if(!HAS3D) return;
  applySt(st);                 /* 与推进段共用同一套状态；sync3 重放时靠它补进度 */
  if(act === 'A1'){
    if(fx === 'dim'){
      /* 环上只留四条在航，其余"砍线"熄灭 */
      const keep = new Set([0, 3, 6, 9]);
      for(let i = 0; i < routeTgt.length; i++) routeTgt[i] = keep.has(i) ? 0.85 : 0.035;
    }
    if(fx === 'bow'){ bowOn = true; if(bowShip) bowShip.visible = true; if(bowWall) bowWall.visible = true; setCam('bow'); }
  }
  if(act === 'A2'){
    /* 波形阶段来自该句的 st.wave —— 不写"第几句"，改台词不会错位 */
    if(fx === 'bulb')   pulse = 0.7;    /* 球鼻艏长出来时闪一下 */
    if(fx === 'flash')  pulse = 1.0;    /* "让浪去杀浪"全场闪光 */
  }
  if(act === 'A3'){
    if(fx === 'tanks') tanksOn = true;
    /* 六舱状态由 st.tank 决定（'scan' 触发扫描光带），这里只放一次性脉冲 */
    if(fx === 'scan'){ tanksOn = true; pulse = 0.55; }
    if(fx === 'quiz'){ pulse = 0.35; }
    if(fx === 'k7')     { k7On = true; if(k7Mark) k7Mark.visible = true; }
    if(fx === 'strait') { straitOn = true; if(straitGate) straitGate.visible = true; pulse = 0.8; }
    if(fx === 'radio')  { pulse = 0.5; }
  }
  if(act === 'CD'){
    if(fx === 'alarm'){ alarmOn = true; if(alarmLight) alarmLight.intensity = 22; }
  }
};

/* 3D 异步加载完成后，把已经发生过的进度补上 */
function sync3(){
  if(!HAS3D) return;
  const cur = ACTS[ai] ? ACTS[ai].s3 : 'map';   /* 必须用 s3（'map'/'wave'/'ship'），不是 k（'A1'） */
  setStage3(cur);
  for(let a = 0; a <= ai; a++){
    const k = ACTS[a].k, arr = BEATS[k];
    const upto = (a === ai) ? bi : arr.length - 1;
    for(let i = 0; i <= upto; i++) fx3(k, i, arr[i].fx, arr[i].st);
  }
}

/* ================================================================
   每帧
   ================================================================ */
let d3Err = false;
function tick3(){
  requestAnimationFrame(tick3);
  try{
    const dt = clock ? Math.min(0.05, clock.getDelta()) : 0.016;
    t3 += dt; stageT += dt;
    if(pulse > 0) pulse = Math.max(0, pulse - dt * 1.1);

    /* --- 公共海面起伏 --- */
    if(seaGeo){
      const p = seaGeo.attributes.position, b = seaBase;
      for(let i = 0; i < p.count; i++){
        const x = b[i*3], z = b[i*3+2];
        p.array[i*3+1] = 0.42*Math.sin(x*0.11 + t3*0.55) + 0.30*Math.sin(z*0.15 - t3*0.42)
                       + 0.16*Math.sin((x+z)*0.24 + t3*0.9);
      }
      p.needsUpdate = true; seaGeo.computeVertexNormals();
    }

    /* --- 第一幕：航线亮灭 + 小船 --- */
    if(mapGroup && mapGroup.visible){
      for(let i = 0; i < routeTubes.length; i++){
        routeCur[i] += (routeTgt[i] - routeCur[i]) * Math.min(1, dt * 1.6);
        const m = routeTubes[i].material;
        m.emissiveIntensity = routeCur[i] * (1 + 0.16*Math.sin(t3*1.4 + i));
        m.color.setHex(routeCur[i] > 0.3 ? 0x1d4650 : 0x14262c);
      }
      if(bowOn && bowShip){
        /* 船位固定：让海面在动，读起来才像"她在前进" */
        bowShip.position.set(0, 0.25 + 0.07 * Math.sin(t3 * 1.7), 0);
        bowShip.rotation.z = 0.030 * Math.sin(t3 * 1.3);
        bowShip.rotation.x = 0.018 * Math.sin(t3 * 0.9 + 1.2);
        if(bowWall){
          bowWall.material.opacity = 0.34 + 0.12 * Math.sin(t3 * 3.1);
          bowWall.scale.y = 1 + 0.05 * Math.sin(t3 * 2.2);
        }
      }
    }

    /* --- 第二幕：两列波相消 --- */
    if(waveGroup && waveGroup.visible){
      /* 阶段来自剧情数据的 st.wave（推进段维护），不在 3D 里写死第几句 */
      wavePhase = waveReq;
      /* 目标值 → 插值 */
      let tgtAmp = 0, tgtPh = 0, tgtBulb = 0;
      if(wavePhase >= 2){ tgtAmp = 1; tgtBulb = 1; }   /* 球鼻艏也掀一列波 */
      if(wavePhase >= 3){ tgtPh = 1; }                 /* 反相 → 相消 */
      ampMix  += (tgtAmp  - ampMix)  * Math.min(1, dt * 1.5);
      phaseMix += (tgtPh  - phaseMix) * Math.min(1, dt * 1.1);
      bulbMix += (tgtBulb - bulbMix) * Math.min(1, dt * 2.2);
      if(bulbMesh) bulbMesh.scale.set(2.4 * bulbMix + 0.001, 1.2 * bulbMix + 0.001, 1.2 * bulbMix + 0.001);

      const ph = phaseMix * Math.PI;
      const a2 = ampMix;
      const N = 130;
      for(let li = 0; li < 3; li++){
        const arr = waveArrs[li];
        for(let i = 0; i < N; i++){
          const x = -6.5 + (13.0 * i) / (N - 1);
          const w = waveAt(x, t3, a2, ph);
          const v = li === 0 ? w.w1 : li === 1 ? w.w2 : w.sum;
          /* 三条线分层排开，各自看清：船艏波 / 球鼻艏波 / 合成波 */
          const baseY = li === 0 ? 5.30 : li === 1 ? 3.50 : 1.70;
          arr[i*3]     = x;
          arr[i*3 + 1] = baseY + v * 0.55;
          arr[i*3 + 2] = -1.6;
        }
        waveLines[li].geometry.attributes.position.needsUpdate = true;
      }
      waveLines[1].material.opacity = 0.20 + 0.52 * ampMix;
      waveLines[2].material.opacity = 0.55 + 0.45 * phaseMix;
      waveLines[2].material.color.setHex(phaseMix > 0.6 ? 0x8affd8 : 0xffffff);

      /* 演示水面：用合成波驱动高度 */
      if(waveSeaGeo){
        const p = waveSeaGeo.attributes.position, b = waveSeaBase;
        for(let i = 0; i < p.count; i++){
          const x = b[i*3], z = b[i*3+2];
          const w = waveAt(x * 0.9, t3, a2, ph);
          p.array[i*3+1] = w.sum * 0.30 + 0.07*Math.sin(z*0.7 + t3*0.8);
        }
        p.needsUpdate = true; waveSeaGeo.computeVertexNormals();
      }
    }

    /* --- 第三幕：六舱 --- */
    if(shipGroup && shipGroup.visible){
      tankPulse += dt;
      if(scanT < 2.6) scanT += dt;
      /* 扫描进度：光带位置 0..1，来回扫一趟 */
      const scanP = scanT < 2.6 ? Math.min(1, scanT / 2.0) : -1;
      for(let i = 0; i < 6; i++){
        let on = false, tgt = 0.05, rt = 0, hex = 0x123038;
        if(tankMode === 1){
          /* 介绍阶段：依次点亮，告诉玩家"船上有六座水池" */
          on  = tanksOn && i < tankLit;
          tgt = on ? 0.55 + 0.30*Math.sin(tankPulse*2.1 + i*0.7) : 0.05;
          hex = on ? 0x1d5560 : 0x123038;
          rt  = on ? 0.20 + 0.16*Math.sin(tankPulse*1.7 + i*0.9) : 0;
        } else if(tankMode === 2){
          /* 摸底阶段：全部转"待判定"—— 暗着，只有扫描光带扫过时亮一下 */
          const head = (i + 0.5) / 6;
          const hit  = scanP >= 0 ? Math.max(0, 1 - Math.abs(head - scanP) * 7) : 0;
          tgt = 0.05 + 0.85 * hit + (scanP < 0 ? 0.06 * (1 + Math.sin(tankPulse*1.6 + i*0.8)) : 0);
          hex = hit > 0.05 ? 0x2a6a72 : 0x123038;
          rt  = 0.10 * (1 + Math.sin(tankPulse*1.4 + i*0.6)) + 0.45 * hit;
        }
        const mat = tankBoxes[i].material;
        mat.emissiveIntensity += (tgt - mat.emissiveIntensity) * Math.min(1, dt * 6.5);
        mat.color.setHex(hex);
        const rr = tankRings[i].material;
        rr.opacity += (rt - rr.opacity) * Math.min(1, dt * 6.5);
      }
      if(k7On && k7Mark){
        k7Mark.children[0].material.emissiveIntensity = 0.9 + 0.5*Math.sin(t3*2.6);
        k7Mark.children[1].material.opacity = 0.42 + 0.28*Math.sin(t3*2.6);
        k7Mark.children[1].rotation.z += dt * 0.5;
      }
      if(straitOn && straitGate){
        straitGate.children[2].material.emissiveIntensity = 0.7 + 0.5*Math.sin(t3*1.8);
      }
      if(alarmOn && alarmLight){
        alarmLight.intensity = 14 + 12*Math.abs(Math.sin(t3*4.2));
      }
      /* 缓慢摆动，避免画面死板 */
      shipGroup.rotation.y = 0.06 * Math.sin(t3 * 0.28);
      shipGroup.position.y = 0.12 * Math.sin(t3 * 0.45);
    }

    /* --- 全场脉冲 --- */
    if(pulse > 0){
      const k = pulse * pulse;
      scene.fog.near = 42 - 20 * k;
    } else if(scene.fog){
      scene.fog.near += (42 - scene.fog.near) * Math.min(1, dt * 2);
    }

    /* --- 镜头 --- */
    const c = CAMS[camKey];
    const k = Math.min(1, dt * 1.35);
    camP.x += (c.p[0] - camP.x) * k; camP.y += (c.p[1] - camP.y) * k; camP.z += (c.p[2] - camP.z) * k;
    camL.x += (c.l[0] - camL.x) * k; camL.y += (c.l[1] - camL.y) * k; camL.z += (c.l[2] - camL.z) * k;
    const drift = REDUCE_MOTION ? 0 : (camKey === 'alarm' ? 0.055 : 0.16);
    camera.position.set(camP.x + Math.sin(t3*.24)*drift, camP.y + Math.sin(t3*.31)*drift*.55, camP.z);
    camera.lookAt(camL.x + Math.sin(t3*.19)*drift*.35, camL.y, camL.z);

    renderer.render(scene, camera);
  }catch(e){
    if(!d3Err){ d3Err = true; console.warn('3D 帧更新异常（已忽略）：', e && e.message); }
  }
}

boot3D();

</script>
